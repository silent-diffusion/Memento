name: Release

on:
  push:
    tags: ["v*"]

# Nothing may write by default. Only the publish job, which runs no project code and installs no packages, can
# change the release (security audit 2026-10-07: a compromised npm or NuGet package running in the build must not
# be able to replace Setup.exe or the update feed).
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    name: Build, test and pack
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Check the tag matches Directory.Build.props
        id: version
        shell: pwsh
        run: |
          [xml] $props = Get-Content Directory.Build.props -Raw
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match <Version>$version</Version> in Directory.Build.props."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          # 0.1–0.4 were pre-releases; 0.5.0 and everything after it (1.0.0 is the first public release) are full releases,
          # except a version with a suffix (0.6.0-rc.1). The app's update check follows the same rule (UpdatePolicy).
          $core = [version]($version.Split('-')[0])
          $prerelease = ($core -lt [version]'0.5.0') -or $version.Contains('-')
          "prerelease=$($prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Lint UI
        working-directory: ui
        run: npm run lint

      - name: Test UI
        working-directory: ui
        run: npm test

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Restore
        run: dotnet restore Memento.sln

      - name: Build
        run: dotnet build Memento.sln -c Release --no-restore /warnaserror

      - name: Test
        run: dotnet test Memento.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Restore vpk
        run: dotnet tool restore

      # The previous release lets vpk build a delta package. There is none before the first release.
      # Reading a public release needs only the read-only token.
      - name: Download previous release
        continue-on-error: true
        run: >-
          dotnet vpk download github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir build/out

      - name: Pack installer
        shell: pwsh
        run: ./build/pack.ps1 -SkipUiBuild -KeepOutput

      # CycloneDX bills of materials: the NuGet packages the app and the worker ship, and the UI's runtime npm
      # packages (build/sbom.ps1). The publish job attaches them to the release.
      - name: Generate SBOM
        shell: pwsh
        run: ./build/sbom.ps1

      - name: SHA-256 of every release file
        shell: pwsh
        run: |
          $files = Get-ChildItem build/out, build/sbom -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' }
          $lines = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $f.Name }
          Set-Content build/sbom/SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: |
            build/out
            build/sbom
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Only the tool manifest is needed (vpk); no project code runs here and nothing is installed from npm.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            dotnet-tools.json
            nuget.config
            global.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v7
        with:
          name: installer
          path: build

      - name: Restore vpk
        run: dotnet tool restore

      # Creates or updates the GitHub release with Setup.exe, the portable zip and the update feed.
      # The release text is the version's section of build/RELEASE-NOTES.md, embedded by pack.ps1.
      - name: Publish GitHub release
        run: >-
          dotnet vpk upload github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir build/out
          --tag ${{ github.ref_name }}
          --releaseName "Memento ${{ needs.build.outputs.version }}"
          --publish
          --merge
          ${{ needs.build.outputs.prerelease == 'true' && '--pre' || '' }}

      - name: Attach SBOM and checksums to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} build/sbom/memento-dotnet.cdx.json build/sbom/memento-ui.cdx.json build/sbom/SHA256SUMS.txt --clobber --repo ${{ github.repository }}
