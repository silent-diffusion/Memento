<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Memento Library, grid view, dark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.app{--bg:#EFEDE8;--surface:#EFEDE8;--surface-2:#E4E1DA;--line:rgba(29,28,26,.07);--line-strong:#C9C5BC;--text:#1D1C1A;--text-2:#5E5B55;--text-3:#7D7971;--accent:#C2410C;--accent-soft:#FBE9E0;--accent-text:#9A3412;--ok:#2F6B4F;--ok-soft:#E3EFE8;--focus:#2563EB;--danger:#B42318;--danger-soft:#F6E0DD;--neo-card:-8px -8px 18px rgba(255,255,255,.9),10px 10px 22px rgba(29,28,26,.14);--neo-sm:-4px -4px 10px rgba(255,255,255,.9),5px 5px 12px rgba(29,28,26,.14);--neo-sm-hi:-6px -6px 14px rgba(255,255,255,.95),7px 7px 16px rgba(29,28,26,.17);--neo-xs:-2px -2px 5px rgba(255,255,255,.9),3px 3px 6px rgba(29,28,26,.12);--neo-in:inset 4px 4px 9px rgba(29,28,26,.13),inset -4px -4px 9px rgba(255,255,255,.9);--neo-in-xs:inset 2px 2px 4px rgba(29,28,26,.14),inset -2px -2px 4px rgba(255,255,255,.9);--neo-accent:-4px -4px 10px rgba(255,255,255,.7),6px 6px 14px rgba(194,65,12,.35);--neo-accent-in:inset 4px 4px 8px rgba(0,0,0,.25),inset -3px -3px 8px rgba(255,255,255,.25);--neo-bar:0 8px 18px rgba(29,28,26,.08);--accent-grad:linear-gradient(145deg,#D04E18,#B03A0A);--danger-grad:linear-gradient(145deg,#C43024,#9E1C12);--knob:linear-gradient(145deg,#FFFFFF,#E4E1DA)}
.app.dark{--bg:#1F1E1B;--surface:#1F1E1B;--surface-2:#1A1917;--line:rgba(255,255,255,.06);--line-strong:#434039;--text:#EDEAE4;--text-2:#A8A49C;--text-3:#86827A;--accent:#F08A5C;--accent-soft:#3A2218;--accent-text:#F4A37E;--ok:#7FC7A3;--ok-soft:#1E2F27;--focus:#60A5FA;--danger:#F28B82;--danger-soft:#3A1F1C;--neo-card:-8px -8px 18px rgba(255,255,255,.035),10px 10px 22px rgba(0,0,0,.6);--neo-sm:-4px -4px 10px rgba(255,255,255,.04),5px 5px 12px rgba(0,0,0,.6);--neo-sm-hi:-6px -6px 14px rgba(255,255,255,.05),7px 7px 16px rgba(0,0,0,.65);--neo-xs:-2px -2px 5px rgba(255,255,255,.04),3px 3px 6px rgba(0,0,0,.55);--neo-in:inset 4px 4px 9px rgba(0,0,0,.6),inset -4px -4px 9px rgba(255,255,255,.04);--neo-in-xs:inset 2px 2px 4px rgba(0,0,0,.6),inset -2px -2px 4px rgba(255,255,255,.04);--neo-accent:-4px -4px 10px rgba(255,255,255,.04),6px 6px 14px rgba(240,138,92,.3);--neo-accent-in:inset 4px 4px 8px rgba(0,0,0,.4),inset -3px -3px 8px rgba(255,255,255,.15);--neo-bar:0 8px 18px rgba(0,0,0,.5);--accent-grad:linear-gradient(145deg,#F79A70,#E07848);--danger-grad:linear-gradient(145deg,#F6A09A,#D9655C);--knob:linear-gradient(145deg,#34322E,#242320)}
.app a{color:var(--text)}.app a:hover{color:var(--accent)}
.app a.btn,.app a.btn:hover,.app a.card,.app a.card:hover,.app a.icon-btn,.app a.icon-btn:hover{color:inherit;text-decoration:none}
.app a.primary,.app a.primary:hover{color:#FFFFFF}
.btn,.chip,.card,.icon-btn{cursor:pointer;font:inherit;color:inherit}
.btn:focus-visible,.chip:focus-visible,.card:focus-visible,.icon-btn:focus-visible,.search:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.card:hover{border-color:var(--line-strong)}
.icon-btn:hover,.ghost:hover{background:var(--surface-2)}
.icon-btn.on{background:var(--surface-2);color:var(--text)}
.chip:hover{border-color:var(--line-strong)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.primary:hover{filter:brightness(.94)}
.search::placeholder{color:var(--text-3)}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.done{background:var(--surface-2);color:var(--text-2)}
.pill.active{background:var(--accent-soft);color:var(--accent-text)}
.pill.queued{border:1px dashed var(--line-strong);color:var(--text-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wb{flex:1;border-radius:1px;background:var(--ok)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.mono{font-family:'JetBrains Mono',Consolas,monospace}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* neumorphism: one matte ground, paired light/dark shadows, controls that depress */
.pill{box-shadow:var(--neo-xs)}
.pill.done{background:var(--surface)}
.pill.queued,.pill.failed{box-shadow:none}
.chip.on,.nav.on,.icon-btn.on{background:var(--surface);color:var(--text);box-shadow:var(--neo-in-xs)}
.seg{border-radius:12px;transition:box-shadow .12s,transform .12s,background .12s}
.seg.on{background:var(--surface);color:var(--text);box-shadow:var(--neo-xs)}
.tog{box-shadow:var(--neo-in-xs);background:var(--surface-2);transition:background .18s}
.tog.on{background:var(--text)}
.tog span{background:var(--knob);box-shadow:2px 3px 6px rgba(29,28,26,.28),-1px -1px 2px rgba(255,255,255,.8);transition:left .22s cubic-bezier(.34,1.56,.64,1),width .1s}
.tog.on span{background:var(--knob)}
.app.dark .tog span{box-shadow:2px 3px 6px rgba(0,0,0,.6),-1px -1px 2px rgba(255,255,255,.08)}
.tog:active span{width:20px}
.tog.on:active span{left:17px}
.primary{box-shadow:var(--neo-accent)}
.primary:hover{filter:none;box-shadow:var(--neo-accent),-6px -6px 14px rgba(255,255,255,.5)}
.primary:active{box-shadow:var(--neo-accent-in)!important;transform:translateY(1px) scale(.985)}
.ghost:hover,.icon-btn:hover,.pal:hover,.nav:hover,.chip:hover,.card:hover{background:var(--surface);box-shadow:var(--neo-sm-hi)}
.ghost:active,.icon-btn:active,.pal:active,.nav:active,.chip:active,.card:active,.seg:active,.sw:active,.modhead:active,.chap:active,.segm:active{box-shadow:var(--neo-in)!important;transform:translateY(1px) scale(.985)}
.chip.on:hover,.nav.on:hover,.icon-btn.on:hover{box-shadow:var(--neo-in-xs)}
.row:hover{background:var(--surface);box-shadow:var(--neo-in-xs)}
.row:active{box-shadow:var(--neo-in)!important}
.row.selected{box-shadow:var(--neo-in)}
.mod{border-color:transparent;border-radius:20px;box-shadow:var(--neo-sm)}
.mod:hover{box-shadow:var(--neo-sm-hi)}
.mod.on{border-color:transparent;box-shadow:var(--neo-sm),0 0 0 2px var(--text)}
.paper{border:none;border-radius:12px;box-shadow:var(--neo-card)}
.ver{border-color:transparent;border-radius:16px;box-shadow:var(--neo-sm)}
.ver.cur{box-shadow:var(--neo-sm),0 0 0 2px var(--text)}
.segm{border-radius:16px}
.segm:hover{background:var(--surface);box-shadow:var(--neo-in-xs)}
.segm.now{background:var(--surface);box-shadow:var(--neo-in)}
.chap{border-radius:12px}
.chap:hover{background:var(--surface);box-shadow:var(--neo-in-xs)}
.chap.on{background:var(--surface);box-shadow:var(--neo-in)}
.sw{box-shadow:var(--neo-xs)}
.sw.on{box-shadow:var(--neo-xs),0 0 0 2px var(--text)}
.drop{border:none;border-radius:24px;box-shadow:var(--neo-in)}
.drop.hot{box-shadow:var(--neo-in),0 0 0 2px var(--accent)}
.dz.live{border:none;box-shadow:var(--neo-in)}
.dz.live.hot{box-shadow:var(--neo-in),0 0 0 2px var(--accent)}
.side.live{border:none;box-shadow:var(--neo-in)}
.item{border-radius:14px}
.item:hover{background:var(--surface);box-shadow:var(--neo-in-xs)}
.g{border:none!important;background:var(--surface)!important;box-shadow:var(--neo-sm);border-radius:14px!important}
.g:active{box-shadow:var(--neo-in)!important;transform:translateY(1px) scale(.985)}
.p{background:var(--accent-grad)!important;box-shadow:var(--neo-accent);border-radius:14px!important}
.p:active{box-shadow:var(--neo-accent-in)!important;transform:translateY(1px) scale(.985)}
.d{background:var(--danger-grad)!important;box-shadow:-4px -4px 10px rgba(255,255,255,.7),6px 6px 14px rgba(180,35,24,.35);border-radius:14px!important}
.d:active{box-shadow:var(--neo-accent-in)!important;transform:translateY(1px) scale(.985)}
.chk{accent-color:var(--text);filter:drop-shadow(1px 1px 1px rgba(29,28,26,.2))}
.bar.live,.wb.played{background:var(--ok)}
.search,.field,.input{transition:box-shadow .15s}
.search:focus,.field:focus,.input:focus{box-shadow:var(--neo-in),0 0 0 2px var(--focus)!important;outline:none}
.sw,.pal,.nav,.chip,.icon-btn,.ghost,.btn,.seg,.card,.row,.mod,.pill,.modhead,.chap,.segm,.item{transition:box-shadow .15s ease,transform .08s ease,background .15s ease}
.btn:active,.icon-btn:active{transition-duration:.04s}
</style>
</helmet>
<div class="app {{themeClass}}" style="min-height: 100vh; background: var(--bg); color: var(--text); font-family: Manrope, 'Segoe UI Variable', system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column">

  <header style="min-height: 60px; box-sizing: border-box; padding: 0 24px; background: var(--surface); box-shadow: var(--neo-bar); position: relative; z-index: 1; display: flex; align-items: center; gap: 24px; flex-wrap: wrap">
    <div style="display: flex; align-items: center; gap: 10px; min-width: 160px">
      <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--text); display: flex; align-items: center; justify-content: center; box-sizing: border-box"><span style="width: 10px; height: 10px; border-radius: 50%; background: var(--accent)"></span></span>
      <span style="font-size: 17px; font-weight: 700; letter-spacing: -0.01em">Memento</span>
    </div>
    <div style="flex: 1 1 320px; display: flex; justify-content: center">
      <div style="position: relative; width: 100%; max-width: 520px">
        <label class="sr" for="grid-search">Search recordings</label>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 14px; top: 11px; color: var(--text-3)"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="grid-search" class="search" type="search" value="{{query}}" onChange="{{onSearch}}" placeholder="Search recordings, transcripts, people" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 14px 0 42px; border-radius: 16px; border: none; background: var(--bg); box-shadow: var(--neo-in); color: var(--text); font: inherit; font-size: 14px">
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; min-width: 160px; justify-content: flex-end">
      <a class="btn primary" href="Record.dc.html" style="height: 40px; padding: 0 18px 0 14px; border-radius: 16px; background: var(--accent-grad); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 9px">
        <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #FFFFFF"></span>
        New recording
      </a>
      <a class="icon-btn" href="Settings.dc.html" aria-label="Settings" style="width: 40px; height: 40px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; color: var(--text-2)">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
      </a>
    </div>
  </header>

  <main style="flex: 1; padding: 40px 48px 56px; box-sizing: border-box">
    <div style="width: 100%; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">

      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1">Library</h1>
          <p style="margin: 0; font-size: 14px; color: var(--text-2)">{{summary}}</p>
        </div>
        <div style="display: flex; align-items: center; gap: 6px">
          <button class="btn ghost" type="button" style="height: 36px; padding: 0 12px; border-radius: 14px; border: none; background: var(--surface); box-shadow: var(--neo-sm); font-size: 13px; font-weight: 600; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px">
            Newest first
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
          <a class="icon-btn" href="Main.dc.html" aria-label="List view" style="width: 36px; height: 36px; border-radius: 14px; border: none; background: var(--surface); box-shadow: var(--neo-sm); display: inline-flex; align-items: center; justify-content: center; color: var(--text-2)">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </a>
          <button class="icon-btn on" type="button" aria-label="Grid view" aria-pressed="true" style="width: 36px; height: 36px; border-radius: 14px; border: none; background: var(--surface); box-shadow: var(--neo-sm); display: inline-flex; align-items: center; justify-content: center; color: var(--text-2)">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg>
          </button>
        </div>
      </div>

      <div role="group" aria-label="Filter by type" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="7">
        <button class="chip {{c.cls}}" type="button" onClick="{{c.pick}}" style="height: 32px; padding: 0 14px; border-radius: 999px; border: none; background: var(--surface); box-shadow: var(--neo-sm); font-size: 13px; font-weight: 600; color: var(--text-2)">{{c.label}}</button>
        </sc-for>
      </div>

      <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <div style="padding: 48px; text-align: center; color: var(--text-2); border: 1px dashed var(--line-strong); border-radius: 24px">No recordings match. Try another type or clear the search.</div>
      </sc-if>

      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 12px">
        <h2 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); padding-left: 2px">{{g.label}}</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(264px, 1fr)); gap: 16px">
          <sc-for list="{{g.items}}" as="item" hint-placeholder-count="3">
          <a class="card" href="Review.dc.html" style="display: flex; flex-direction: column; background: var(--surface); border-radius: 24px; box-shadow: var(--neo-card); overflow: hidden; min-height: 220px">
            <sc-if value="{{item.video}}" hint-placeholder-val="{{false}}">
            <div aria-hidden="true" style="height: 118px; background: #2A2824; display: flex; align-items: center; justify-content: center; position: relative">
              <div style="position: absolute; inset: 14px 14px 28px 14px; border-radius: 6px; background: #3A3733"></div>
              <div style="position: absolute; right: 22px; bottom: 36px; width: 56px; height: 36px; border-radius: 4px; background: #57534C"></div>
              <span style="position: relative; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.92); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="#1D1C1A"><path d="M8 5v14l11-7z"></path></svg></span>
              <span class="mono" style="position: absolute; left: 14px; bottom: 8px; font-size: 11px; color: #C9C5BC">Screen + camera</span>
            </div>
            </sc-if>
            <sc-if value="{{item.audio}}" hint-placeholder-val="{{true}}">
            <div aria-hidden="true" style="height: 118px; background: var(--surface-2); display: flex; align-items: center; gap: 2px; padding: 0 20px; box-sizing: border-box">
              <sc-for list="{{item.bars}}" as="b" hint-placeholder-count="40"><div class="wb" style="height: {{b.h}}"></div></sc-for>
            </div>
            </sc-if>
            <div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1">
              <div style="display: flex; align-items: flex-start; gap: 10px">
                <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 14px; background: var(--surface-2); box-shadow: var(--neo-in); display: flex; align-items: center; justify-content: center; color: var(--text-2); flex: none">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{item.icon}}"></path></svg>
                </span>
                <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1">
                  <span class="clamp" style="font-size: 15px; font-weight: 600; line-height: 1.3">{{item.title}}</span>
                  <span style="font-size: 12px; color: var(--text-2)">{{item.meta}}</span>
                </div>
                <span class="mono" style="font-size: 12px; color: var(--text-2); flex: none">{{item.dur}}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: auto">
                <sc-for list="{{item.pills}}" as="p" hint-placeholder-count="2">
                <span class="pill {{p.kind}}"><sc-if value="{{p.done}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg></sc-if>{{p.label}}</span>
                </sc-for>
                <sc-if value="{{item.noPills}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; color: var(--text-3)">Audio only</span></sc-if>
              </div>
            </div>
          </a>
          </sc-for>
        </div>
      </section>
      </sc-for>

    </div>
  </main>

  <footer style="min-height: 36px; box-sizing: border-box; padding: 0 24px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 16px; font-size: 12px; color: var(--text-3); flex-wrap: wrap">
    <span style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: var(--ok)"></span>Local transcription ready · GPU</span>
    <span>Everything is stored on this PC · 212 GB free</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"dark","section":"Appearance"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'All', query: '' };
  }
  icons() {
    return {

      Interview: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',
      Lecture: 'M2 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H2z M22 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z',
      Presentation: 'M3 4h18v12H3z M8 21h8 M12 16v5',
      Dictation: 'M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z M19 11a7 7 0 0 1-14 0 M12 18v4 M8 22h8',
      Research: 'M9 3h6v4H9z M9 5H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3 M8 12h8 M8 16h5'

  fmt(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    const mm = String(m).padStart(h ? 2 : 1, '0'), ss = String(s).padStart(2, '0');
    return h ? h + ':' + mm + ':' + ss : mm + ':' + ss;
  }
  fmtTotal(sec) {
    const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
    return (h ? h + ' h ' : '') + m + ' min';
  }
  bars(seed) {
    const out = []; let v = seed;
    for (let i = 0; i < 48; i++) { v = (v * 9301 + 49297) % 233280; const r = v / 233280; out.push({ h: Math.round(4 + r * r * 56) + 'px' }); }
    return out;
  }
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const icons = this.icons();
    const q = this.state.query.trim().toLowerCase();

    const visible = all.filter(r => (this.state.filter === 'All' || r.type === this.state.filter) && (!q || (r.title + ' ' + r.type + ' ' + r.people).toLowerCase().includes(q)));

    })).filter(g => g.items.length);

    const total = visible.reduce((a, r) => a + r.dur, 0);
    return {
      themeClass: theme === 'dark' ? 'dark' : '',
      query: this.state.query,
      onSearch: (e) => this.setState({ query: e.target.value }),
      summary: visible.length + (visible.length === 1 ? ' recording' : ' recordings') + ' · ' + this.fmtTotal(total) + ' · all on this PC',
      chips, groups, empty: visible.length === 0
    };
